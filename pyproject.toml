[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scengen"
version = "0.1.0"
description = "Infra IR 기반 공격 시나리오 생성기"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
scengen = "scengen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scengen = ["schema/*.json", "data/*.json", "ir/*.yaml", "ir/crosswalk/*.yaml", "ir/crosswalk_d3fend.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
