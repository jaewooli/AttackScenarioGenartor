# MITRE ATT&CK 공격 기법(상위 기법) → IR 대조표 (WBS 1.6.1)
#
# 질문: "이 기법이 가능하려면 필요한 인프라 상태를 IR로 표현할 수 있는가?"
# 추상 수준만 다룬다: 전제가 되는 인프라 상태만 적고, 실행 방법은 적지 않는다 (CLAUDE.md 5장).
#
# role
#   transition    공격자 상태(attacker-state.md)를 바꿈 → 규칙의 대상. ir 필수
#   goal          피해를 냄 (영향 목표) → ir 필수
#   discovery     정보를 얻음 → uninformed 변형의 knows
#   in_foothold   이미 가진 거점 안에서의 행위. 거점 외의 인프라 조건 없음
#   state_neutral 단조성 모델에서 공격자 상태를 바꾸지 않음 (지속, 은닉, 방어 무력화, 통신)
#   pre           공격 전 단계 (정찰, 자원 준비)
# status: covered | partial(limit 필수) | missing | out_of_scope(reason 필수)
# ir: config:<키> | relation:<타입> | field:<스키마 필드>
#
# 명시하지 않은 기법은 defaults_by_tactic 의 첫 번째 일치 전술로 분류한다.

attack_version: "20.1"

# 대조 중 발견해서 IR을 보강한 것 (2026-11-21). 보강 전에는 아래 기법들이 표현 불가였다.
findings:
  - { gap: "여러 자산에 한꺼번에 적용되는 정책 객체가 없음", fix: "asset type policy + manages(정책 → 적용 대상)", techniques: [T1484, T1037] }
  - { gap: "웹·SaaS 서비스 세션을 표현할 수 없음 (세션이 서버에만 붙음)", fix: "session 도착 노드에 service 허용", techniques: [T1185, T1539] }
  - { gap: "다중 인증 방식의 강도 구분 없음", fix: "config auth.mfa_strength", techniques: [T1111, T1621] }
  - { gap: "클라우드 저장소 공개 여부를 표현할 수 없음", fix: "access.anonymous 를 data_store 에도 허용", techniques: [T1530] }
  - { gap: "클라우드 메타데이터 서비스 보호 설정 없음", fix: "config host.metadata_service_protection", techniques: [T1552] }
  - { gap: "Kerberos 관련 계정 속성 없음", fix: "config account.service_principal, account.kerberos_preauth", techniques: [T1558] }
  - { gap: "컨테이너 설정 없음", fix: "config container.privileged, container.host_mounts, container.service_account_token", techniques: [T1611] }
  - { gap: "무선 네트워크 구간을 표현할 수 없음", fix: "group kind wireless", techniques: [T1669] }
  - { gap: "대규모 트래픽 방어 설정 없음", fix: "config network.ddos_protection", techniques: [T1498, T1499] }
  - { gap: "방어 무력화 상태를 공격자 상태로 표현할 수 없음 (IR이 아니라 공격자 상태 모델의 빈틈)", fix: "P2에서 결정 (attacker-state.md 후보)", techniques: [] }

defaults_by_tactic:
  - tactic: discovery
    role: discovery
    status: covered
    ir: [field:attacker_profile.knowledge]
    how: 거점에서 닿는 범위의 정보를 얻음. uninformed 변형에서 knows 사실로 반영
  - tactic: execution
    role: in_foothold
    status: covered
    ir: [relation:runs]
    how: 거점 안에서 코드를 실행하는 수단. 원격 실행은 원격 서비스(T1021)와 같은 조건(도달 + 로그인 가능)
  - tactic: persistence
    role: state_neutral
    status: covered
    ir: []
    how: 단조성 가정상 이미 얻은 상태를 유지하는 행위는 상태를 바꾸지 않음. 시간·탐지 모델이 생기면 다시 봄
  - tactic: stealth
    role: state_neutral
    status: covered
    ir: []
    how: 탐지를 피하는 행위. 탐지는 현재 모델 밖
  - tactic: defense-impairment
    role: state_neutral
    status: covered
    ir: []
    how: 방어를 끄는 행위. 방어 설정 자체는 IR에 있으나, "방어를 무력화한 상태"는 공격자 상태 후보 (P2에서 결정)
  - tactic: command-and-control
    role: state_neutral
    status: covered
    ir: [relation:reaches]
    how: 외부와의 통신 경로. 외부로 닿는 reaches로 표현 (egress 변형과 같은 조건)
  - tactic: reconnaissance
    role: pre
    status: covered
    ir: [field:attacker_profile.knowledge, config:org.attack_surface_management]
    how: 공격 전 정보 수집. 지식 변형과 외부 노출 관리 키로 표현
  - tactic: resource-development
    role: pre
    status: out_of_scope
    ir: []
    reason: 공격자 쪽 준비 행위. 대상 인프라 상태와 무관

