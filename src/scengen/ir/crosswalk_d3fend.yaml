# MITRE D3FEND → IR 대조표 (WBS 1.6.3)
#
# 질문: "이 방어 기법이 적용되어 있는지를 IR로 표현할 수 있는가?"
# - Model, Harden, Isolate 의 0·1단계 기법은 모두 개별 대조한다 (인프라 상태를 다루는 전술).
# - Detect, Deceive, Evict, Restore 는 전술 기본값 (탐지·기만·사후 대응. 공격 성공 여부를 바꾸지 않음).
# - 2단계 기법은 가장 가까운 상위 기법의 대조를 물려받는다.
# status: covered | partial(limit) | missing | out_of_scope(reason)

reference: MITRE D3FEND
must_map_tactics: [Model, Harden, Isolate]

reasons:
  탐지: 탐지·분석 기법. 현재 모델은 탐지와 시간을 다루지 않는다
  기만: 미끼 기법. 주목적이 탐지이며 현재 모델 밖
  사후: 침입 이후 제거·복구 기법. 공격 단계의 성공 여부를 바꾸지 않는다
  물리: 물리 환경(방사선, 외함, 출입) 보호. 물리 접근은 공격자 시작점으로만 표현한다

findings:
  - { gap: "생체 인증을 인증 방식으로 표현할 수 없음", fix: "auth.methods 에 biometric 추가", items: [D3-BAN] }
  - { gap: "토큰을 기기·연결에 묶는 설정 없음", fix: "config auth.token_binding", items: [D3-TB] }
  - { gap: "자격증명 주기적 교체 없음", fix: "config auth.credential_rotation", items: [D3-CRO] }
  - { gap: "인증서 고정 없음", fix: "config transport.certificate_pinning", items: [D3-CP] }
  - { gap: "산업 제어기의 운전 모드 잠금·변수 쓰기 제한 없음", fix: "config ot.operating_mode_locked, ot.variable_write_restricted", items: [D3-OPR, D3-OVAR] }

defaults_by_tactic:
  Detect: { status: out_of_scope, reason: 탐지 }
  Deceive: { status: out_of_scope, reason: 기만 }
  Evict: { status: out_of_scope, reason: 사후 }
  Restore: { status: out_of_scope, reason: 사후 }

