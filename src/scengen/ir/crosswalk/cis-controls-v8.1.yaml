  - "라이선스(CC BY-NC-ND 4.0) 때문에 원문 제목은 싣지 않는다. '요약'은 이 프로젝트가 쓴 짧은 설명이다."
  - "세이프가드 번호 153개와 보안 기능(fn) 분류는 공식 OSCAL 카탈로그와 일치함을 2026-11-21에 확인했다."
findings:
  - { gap: "신뢰된 DNS 서버 사용 여부 없음", fix: "config network.trusted_dns", items: ["4.9"] }
  - { gap: "자동 화면 잠금 없음", fix: "config host.session_lock", items: ["4.3"] }
  - { gap: "휴대 단말을 표현할 역할 없음", fix: "role mobile_device", items: ["4.10", "4.12"] }
  - { gap: "메일 발신 도메인 인증, 첨부·악성코드 필터링 없음", fix: "config mail.sender_authentication, mail.content_filtering", items: ["9.5", "9.6", "9.7"] }
  - { gap: "포트 단위 접속 통제 없음", fix: "config network.port_access_control", items: ["13.9"] }
  - { gap: "애플리케이션 계층 필터링(웹 방화벽) 없음", fix: "config network.application_filtering", items: ["13.10"] }
  - { gap: "네트워크 장비에 다중 인증·인증 방식을 붙일 수 없음", fix: "auth.mfa, auth.methods 의 applies_to 에 network_device 추가", items: ["12.3"] }
  - { gap: "서비스(애플리케이션) 단위 패치 수준을 붙일 수 없음", fix: "host.patch_currency 의 applies_to 에 service 추가", items: ["7.4"] }
  - { gap: "단말(host)에 잠금 정책을 붙일 수 없었음 (대조표는 표현 가능이라 했지만 샘플에 써보니 붙일 곳이 없었음)", fix: "auth.lockout 의 applies_to 에 host 추가", items: ["4.10"] }
  - { gap: "저장소에 감사 로그 수준을 붙일 수 없음", fix: "logging.audit 의 applies_to 에 data_store 추가", items: ["3.14"] }
reasons:
  절차: 절차·거버넌스 항목. 그 결과는 다른 IR 값(설정, 권한, 패치 수준 등)으로 나타난다
  탐지: 탐지·모니터링 항목. 현재 모델은 탐지와 시간을 다루지 않는다
  사후: 사고 이후 대응·복구 항목. 공격 단계의 성공 여부를 바꾸지 않는다

