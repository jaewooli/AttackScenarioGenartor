# CIS Critical Security Controls v8.1 → IR 대조표 (WBS 1.6.2)
#
# 라이선스 주의: CIS Controls는 CC BY-NC-ND 4.0이며 이용 약관이 원문 게시와 2차 저작을 제한한다.
# 그래서 이 파일에는 세이프가드 번호와 보안 기능 분류(공식 카탈로그의 메타데이터)만 두고,
# 이름(label)은 원문 번역이 아니라 이 프로젝트가 쓴 짧은 요약이다. 원문은 cisecurity.org에서 확인한다.
#
# 질문: "이 세이프가드가 적용되어 있는지를 IR로 표현할 수 있는가?"
# status: covered | partial(limit) | missing | out_of_scope(reason 코드)
# reason 코드: 절차 = 절차·거버넌스 (결과는 다른 IR 값으로 나타남)
#              탐지 = 탐지·모니터링 (현재 모델 밖. 단조성·시간 없음)
#              사후 = 사고 이후 대응·복구 (공격 단계의 성공 여부를 바꾸지 않음)

