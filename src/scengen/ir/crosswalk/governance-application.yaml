# 관리·규제와 애플리케이션 영역 점검 (WBS 1.6.5)
#
# 질문: "범위 안/밖의 경계가 맞는가?" — 영역(분류) 단위로 점검한다.
# 관리·규제 문서는 대부분 절차라 범위 밖이 정상이고, 애플리케이션 문서는 대부분 앱 내부(L3)라 묶음 키로 근사하는 것이 정상이다.
# 이 점검에서 찾는 것은 "인프라 상태인데 범위 밖으로 잘못 빠진 것"과 "반복해서 근사에 그치는 것"이다.

reference: 관리·규제·애플리케이션 영역
version: "2026-11-21"
source: "아래 출처 참고"
question: "범위 안/밖의 경계가 맞는가?"
extra_columns: [문서]
notes:
  - "NIST CSF 2.0: 22개 범주. NIST 공식 내려받기 파일(csrc.nist.gov)에 22개 코드가 모두 있음을 확인"
  - "OWASP ASVS 5.0: 17개 장. 공식 저장소(github.com/OWASP/ASVS, 5.0/en)의 장 목록으로 확인"
  - "OWASP Top 10 2025: 10개. 공식 저장소(github.com/OWASP/Top10, 2025/docs/en)로 확인"
  - "ISMS-P 인증기준: 영역 21개 (관리체계 4, 보호대책 12, 개인정보 처리 단계 5). 공식 원문을 자동으로 받지 못해 영역 구성은 알려진 구조를 따랐다. **원문 대조 필요**"
reasons:
  절차: 관리·거버넌스 절차. 그 결과는 다른 IR 값으로 나타난다
  탐지: 탐지·모니터링. 현재 모델 밖
  사후: 사고 대응·복구. 공격 성공 여부를 바꾸지 않는다
  물리: 물리 보안. 물리 접근은 공격자 시작점으로만 표현한다
findings:
  - { gap: "(반복된 한계) 시스템 간 데이터 흐름 엣지가 없음. CIS 3.8, D3FEND D3-DEM, ISMS-P 3.3 에서 반복", fix: "보류. 데이터 흐름(data_flow) 관계 추가를 P2 규칙 설계 때 결정 (유출 경로 판단에 필요한지 확인)", items: ["isms:3.3"] }
  - { gap: "(반복된 한계) 애플리케이션 내부 검증(입력 검증, 객체 단위 권한, 예외 처리)은 app.secure_development 하나로 근사", fix: "의도된 한계 (L3). 애플리케이션 분석은 MVP 범위 밖", items: ["asvs:V1", "asvs:V2", "top10:A01", "top10:A05"] }

