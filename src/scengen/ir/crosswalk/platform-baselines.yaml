# 플랫폼 설정 기준 샘플 대조 (WBS 1.6.4)
#
# 질문: "개별 설정 키가 필요한 설정이 있는가?" (전수가 아니라 정해진 규칙으로 뽑은 샘플)
# 판단: 개별 = 해당 설정을 직접 표현하는 키·관계가 있음
#       묶음 = 묶음 키(os_hardening, logging.audit 등)로 충분. 공격 단계별로 따로 영향을 주지 않음
#       추가 = 이번 대조에서 빠진 것을 발견해 IR에 추가함
#       범위밖 = 공격 단계의 성공 여부를 바꾸지 않음
# 요약(label)은 원문 번역이 아니라 이 프로젝트가 쓴 짧은 설명이다.

reference: 플랫폼 설정 기준 (샘플)
version: "2026-11-21"
source: "아래 표본 규칙 참고"
question: "개별 설정 키가 필요한 설정이 있는가?"
extra_columns: [판단]
notes:
  - "표본 규칙 (재현 가능하도록 고정)"
  - "  리눅스: DISA STIG Ubuntu 24.04 (ComplianceAsCode controls/stig_ubuntu2404.yml) 중 심각도 high(CAT I) 전부 16개"
  - "  쿠버네티스: CIS Kubernetes Benchmark 1.9 (kube-bench cfg/cis-1.9/policies.yaml) 5장 정책 전부 35개. 원문은 CIS 라이선스라 번호와 자체 요약만 싣는다"
  - "  AWS: Security Hub Foundational Security Best Practices 중 IAM, S3, EC2, KMS, EKS, Lambda, Secrets Manager, CloudTrail 통제 전부 69개"
  - "확보 실패: CIS Benchmarks 원문(등록 필요), DISA Windows STIG(사이트에서 자동 내려받기 불가), KISA 주요정보통신기반시설 가이드(공식 PDF 링크 미확보). 윈도우·국내 기준은 원문을 받으면 같은 방식으로 추가한다"
reasons:
  물리: 콘솔·물리 접근 전제. 물리 접근은 공격자 시작점으로만 표현한다
  탐지: 탐지·기록 무결성. 현재 모델 밖
  가용성: 장애 대비·이중화. 공격 성공 여부와 무관
  위생: 운영 정리 항목. 공격 경로를 바꾸지 않음
findings:
  - { gap: "비밀번호가 비어 있는 계정을 표현할 수 없음", fix: "config account.password_empty", items: ["linux:UBTU-24-300027", "linux:UBTU-24-300028"] }
  - { gap: "컨테이너 보안 수준(Pod Security Standards 단계) 없음. 호스트 네임스페이스, root 실행, 권한 상승, 추가 권한(capability)을 하나로 묶는 표준 단계", fix: "config container.pod_security_level", items: ["k8s:5.2.3", "k8s:5.2.6", "k8s:5.2.7", "k8s:5.2.9"] }
  - { gap: "공개 저장소의 읽기/쓰기 구분 불가 (access.anonymous 는 참/거짓뿐)", fix: "has_permission 의 출발 노드에 external 허용 (external → 저장소, read/write)", items: ["aws:S3.2", "aws:S3.3"] }
  - { gap: "사용하지 않는 자격증명(접근 키 등)과 공개된 키를 표현할 수 없음", fix: "account.dormant, access.anonymous 의 applies_to 에 credential 추가", items: ["aws:IAM.8", "aws:KMS.5", "aws:SecretsManager.3"] }

