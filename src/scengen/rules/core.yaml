rule_version: "0.1"
rules:
  - id: D2
    name: "네트워크 도달 대상 발견"
    category: discovery
    attack_techniques: [T1046]
    vars:
      src: { type: asset }
      dst: { type: asset }
    when:
      - neq: [$src, $dst]
      - reaches: { from: $src, to: $dst }
    requires:
      - foothold($src, none)
    adds:
      - knows($dst)
    probability:
      base: { kind: beta, alpha: 8.5, beta: 1.5 }
      capability_scale: false

  - id: D3
    name: "거점 내 실행 서비스·자격증명·저장소 식별"
    category: discovery
    attack_techniques: [T1082, T1083]
    vars:
      host: { type: asset }
      target: { type: asset }
    when:
      - any:
          - relation: { type: runs, from: $host, to: $target }
          - relation: { type: stores, from: $host, to: $target }
          - relation: { type: hosts, from: $host, to: $target }
    requires:
      - foothold($host, user)
    adds:
      - knows($target)
    probability:
      base: { kind: beta, alpha: 8.5, beta: 1.5 }
      capability_scale: false

  - id: D4
    name: "확보 신원의 권한 대상 조회"
    category: discovery
    attack_techniques: [T1087, T1069]
    vars:
      actor: { type: identity }
      target: { type: asset }
    when:
      - any:
          - relation: { type: authenticates_to, from: $actor, to: $target }
          - relation: { type: has_permission, from: $actor, to: $target }
    requires:
      - acts_as($actor)
    adds:
      - knows($target)
    probability:
      base: { kind: beta, alpha: 9.0, beta: 1.0 }
      capability_scale: false

  - id: R1
    name: "그룹 소속 권한 상속"
    category: transition
    attack_techniques: [T1078]
    vars:
      member: { type: identity }
      group: { type: identity, kind: group }
    when:
      - relation: { type: member_of, from: $member, to: $group }
    requires:
      - acts_as($member)
    adds:
      - acts_as($group)
    probability:
      base: { kind: beta, alpha: 9.9, beta: 0.1 }
      capability_scale: false

  - id: R2
    name: "정상 로그인 (유효 계정 원격 접속)"
    category: transition
    attack_techniques: [T1078, T1021, T1133]
    vars:
      actor: { type: identity }
      src: { type: asset }
      target: { type: asset }
      lvl: { type: level }
    when:
      - relation: { type: authenticates_to, from: $actor, to: $target, privilege: $lvl }
      - reaches: { from: $src, to: $target }
    requires:
      - acts_as($actor)
      - foothold($src, none)
      - knows($target)
    adds:
      - foothold($target, $lvl)
    probability:
      base: { kind: beta, alpha: 9.0, beta: 1.0 }
      capability_scale: false
      modifiers:
        - when: { config: [$target, auth.mfa, true] }
          factor: 0.40
        - when: { config: [$actor, account.dormant, true] }
          factor: 0.70

  - id: R2-service
    name: "정상 로그인 (실행 호스트 경유 서비스 접속)"
    category: transition
    attack_techniques: [T1078, T1021]
    vars:
      actor: { type: identity }
      src: { type: asset }
      host: { type: asset }
      svc: { type: asset, asset_type: service }
      lvl: { type: level }
    when:
      - relation: { type: authenticates_to, from: $actor, to: $svc, privilege: $lvl }
      - relation: { type: runs, from: $host, to: $svc }
      - reaches: { from: $src, to: $host, port: $svc.port, protocol: $svc.protocol }
    requires:
      - acts_as($actor)
      - foothold($src, none)
      - knows($svc)
    adds:
      - foothold($svc, $lvl)
      - foothold($host, $lvl)
    probability:
      base: { kind: beta, alpha: 9.0, beta: 1.0 }
      capability_scale: false
      modifiers:
        - when: { config: [$svc, auth.mfa, true] }
          factor: 0.40
        - when: { config: [$actor, account.dormant, true] }
          factor: 0.70

  # ---- R3: 권한 정규화 어휘 기반 (대상 타입·행위별로 실행 가능하게 분해) ----
  - id: R3-data-read
    name: "권한 기반 저장소 데이터 읽기"
    category: transition
    attack_techniques: [T1530, T1039]
    vars:
      actor: { type: asset }
      store: { type: asset, asset_type: data_store }
      data: { type: asset, asset_type: data }
    when:
      - relation: { type: has_permission, from: $actor, to: $store, effect: allow, action_in: [read, admin, modify_permissions, take_ownership] }
      - not_denied: { from: $actor, to: $store }
      - relation: { type: contains, from: $store, to: $data, encrypted: false }
      - any:
          - asset_type: { asset: $actor, type: identity }
          - asset_type: { asset: $actor, type: external }
    requires:
      - any:
          - acts_as($actor)
          - foothold($actor, none)
      - knows($store)
    adds:
      - data_access($data, read)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  - id: R3-data-read-encrypted
    name: "권한 기반 암호화 저장소 복호화 읽기"
    category: transition
    attack_techniques: [T1530, T1039]
    vars:
      actor: { type: asset }
      store: { type: asset, asset_type: data_store }
      data: { type: asset, asset_type: data }
      key: { type: asset, asset_type: credential }
    when:
      - relation: { type: has_permission, from: $actor, to: $store, effect: allow, action_in: [read, admin, modify_permissions, take_ownership] }
      - not_denied: { from: $actor, to: $store }
      - relation: { type: contains, from: $store, to: $data, encrypted: true, key_ref: $key }
      - any:
          - asset_type: { asset: $actor, type: identity }
          - asset_type: { asset: $actor, type: external }
    requires:
      - any:
          - acts_as($actor)
          - foothold($actor, none)
      - has_credential($key)
      - knows($store)
    adds:
      - data_access($data, read)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  - id: R3-data-write
    name: "권한 기반 저장소 데이터 쓰기"
    category: transition
    attack_techniques: [T1530, T1039]
    vars:
      actor: { type: asset }
      store: { type: asset, asset_type: data_store }
      data: { type: asset, asset_type: data }
    when:
      - relation: { type: has_permission, from: $actor, to: $store, effect: allow, action_in: [write, admin, modify_permissions, take_ownership] }
      - not_denied: { from: $actor, to: $store }
      - relation: { type: contains, from: $store, to: $data }
      - any:
          - asset_type: { asset: $actor, type: identity }
          - asset_type: { asset: $actor, type: external }
    requires:
      - any:
          - acts_as($actor)
          - foothold($actor, none)
      - knows($store)
    adds:
      - data_access($data, write)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  - id: R3-data-direct-read
    name: "권한 기반 데이터 객체 직접 읽기"
    category: transition
    attack_techniques: [T1530]
    vars:
      actor: { type: asset }
      data: { type: asset, asset_type: data }
    when:
      - relation: { type: has_permission, from: $actor, to: $data, effect: allow, action_in: [read, admin, modify_permissions, take_ownership] }
      - not_denied: { from: $actor, to: $data }
      - any:
          - asset_type: { asset: $actor, type: identity }
          - asset_type: { asset: $actor, type: external }
    requires:
      - any:
          - acts_as($actor)
          - foothold($actor, none)
      - knows($data)
    adds:
      - data_access($data, read)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  - id: R3-data-direct-write
    name: "권한 기반 데이터 객체 직접 쓰기"
    category: transition
    attack_techniques: [T1565]
    vars:
      actor: { type: asset }
      data: { type: asset, asset_type: data }
    when:
      - relation: { type: has_permission, from: $actor, to: $data, effect: allow, action_in: [write, admin, modify_permissions, take_ownership] }
      - not_denied: { from: $actor, to: $data }
      - any:
          - asset_type: { asset: $actor, type: identity }
          - asset_type: { asset: $actor, type: external }
    requires:
      - any:
          - acts_as($actor)
          - foothold($actor, none)
      - knows($data)
    adds:
      - data_access($data, write)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  - id: R3-host
    name: "권한 기반 호스트·서비스 실행 제어"
    category: transition
    attack_techniques: [T1021, T1037]
    vars:
      actor: { type: asset }
      target: { type: asset }
    when:
      - relation: { type: has_permission, from: $actor, to: $target, effect: allow, action_in: [execute] }
      - not_denied: { from: $actor, to: $target }
      - any:
          - asset_type: { asset: $target, type: host }
          - asset_type: { asset: $target, type: service }
      - any:
          - asset_type: { asset: $actor, type: identity }
          - asset_type: { asset: $actor, type: external }
    requires:
      - any:
          - acts_as($actor)
          - foothold($actor, none)
      - knows($target)
    adds:
      - foothold($target, user)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  - id: R3-host-admin
    name: "권한 기반 호스트·서비스 관리자 제어"
    category: transition
    attack_techniques: [T1021, T1098]
    vars:
      actor: { type: asset }
      target: { type: asset }
    when:
      - relation: { type: has_permission, from: $actor, to: $target, effect: allow, action_in: [admin, modify_permissions, take_ownership] }
      - not_denied: { from: $actor, to: $target }
      - any:
          - asset_type: { asset: $target, type: host }
          - asset_type: { asset: $target, type: service }
      - any:
          - asset_type: { asset: $actor, type: identity }
          - asset_type: { asset: $actor, type: external }
    requires:
      - any:
          - acts_as($actor)
          - foothold($actor, none)
      - knows($target)
    adds:
      - foothold($target, admin)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  - id: R3-policy
    name: "권한 기반 정책 객체 수정"
    category: transition
    attack_techniques: [T1037, T1484]
    vars:
      actor: { type: asset }
      pol: { type: asset, asset_type: policy }
    when:
      - relation: { type: has_permission, from: $actor, to: $pol, effect: allow, action_in: [write, admin, modify_permissions, take_ownership] }
      - not_denied: { from: $actor, to: $pol }
      - asset_type: { asset: $pol, type: policy }
      - any:
          - asset_type: { asset: $actor, type: identity }
          - asset_type: { asset: $actor, type: external }
    requires:
      - any:
          - acts_as($actor)
          - foothold($actor, none)
      - knows($pol)
    adds:
      - foothold($pol, admin)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  - id: R3-identity
    name: "권한 기반 주체 위임·자격증명 초기화·그룹 추가"
    category: transition
    attack_techniques: [T1098, T1078]
    vars:
      actor: { type: asset }
      target: { type: identity }
    when:
      - relation: { type: has_permission, from: $actor, to: $target, effect: allow, action_in: [reset_credential, delegate, admin, modify_permissions, take_ownership] }
      - not_denied: { from: $actor, to: $target }
      - asset_type: { asset: $target, type: identity }
      - any:
          - asset_type: { asset: $actor, type: identity }
          - asset_type: { asset: $actor, type: external }
    requires:
      - any:
          - acts_as($actor)
          - foothold($actor, none)
      - knows($target)
    adds:
      - acts_as($target)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  - id: R3-identity-add-member
    name: "권한 기반 그룹 구성원 추가"
    category: transition
    attack_techniques: [T1098]
    vars:
      actor: { type: asset }
      target: { type: identity, kind: group }
    when:
      - relation: { type: has_permission, from: $actor, to: $target, effect: allow, action_in: [add_member] }
      - not_denied: { from: $actor, to: $target }
      - any:
          - asset_type: { asset: $actor, type: identity }
          - asset_type: { asset: $actor, type: external }
    requires:
      - any:
          - acts_as($actor)
          - foothold($actor, none)
      - knows($target)
    adds:
      - acts_as($target)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  - id: R3-group
    name: "권한 기반 그룹 관리 제어"
    category: transition
    attack_techniques: [T1484, T1098]
    vars:
      actor: { type: asset }
      grp: { type: group }
    when:
      - relation: { type: has_permission, from: $actor, to: $grp, effect: allow, action_in: [admin, modify_permissions, take_ownership] }
      - not_denied: { from: $actor, to: $grp }
      - any:
          - asset_type: { asset: $actor, type: identity }
          - asset_type: { asset: $actor, type: external }
    requires:
      - any:
          - acts_as($actor)
          - foothold($actor, none)
    adds:
      - controls($grp)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  - id: R4
    name: "서비스 실행 계정 탈취"
    category: transition
    attack_techniques: [T1055, T1134, T1543]
    vars:
      host: { type: asset, asset_type: host }
      svc: { type: asset, asset_type: service }
      acct: { type: identity }
    when:
      - relation: { type: runs, from: $host, to: $svc, as: $acct }
    requires:
      - foothold($host, admin)
    adds:
      - acts_as($acct)
    probability:
      base: { kind: beta, alpha: 9.0, beta: 1.0 }
      capability_scale: false
      modifiers:
        - when: { config: [$host, host.privileged_process_protection, true] }
          factor: 0.65

  - id: R5
    name: "로그인 세션·토큰 탈취"
    category: transition
    attack_techniques: [T1003, T1134, T1539, T1185]
    vars:
      actor: { type: identity }
      target: { type: asset }
      freq: { type: value }
    when:
      - relation: { type: session, from: $actor, to: $target, frequency: $freq }
    requires:
      - foothold($target, admin)
    adds:
      - acts_as($actor)
    probability:
      base: { kind: beta, alpha: 6.5, beta: 3.5 }
      capability_scale: false
      modifiers:
        # 세션 빈도: 기준(periodic) 대비 탈취 시점에 세션이 있을 가능성
        - when: { eq: [$freq, persistent] }
          factor: 1.45
        - when: { eq: [$freq, occasional] }
          factor: 0.45
        - when: { eq: [$freq, unknown] }
          factor: 0.60
        - when: { config: [$target, host.credential_protection, true] }
          factor: 0.50

  - id: R6
    name: "보관된 자격증명 추출"
    category: transition
    attack_techniques: [T1552, T1555, T1528, T1003]
    vars:
      asset: { type: asset }
      cred: { type: asset, asset_type: credential }
    when:
      - relation: { type: stores, from: $asset, to: $cred }
    requires:
      - foothold($asset, admin)
    adds:
      - has_credential($cred)
    probability:
      base: { kind: beta, alpha: 9.0, beta: 1.0 }
      capability_scale: false
      modifiers:
        - when: { config: [$asset, host.metadata_service_protection, true] }
          factor: 0.45

  - id: R7
    name: "탈취 자격증명으로 신원 획득"
    category: transition
    attack_techniques: [T1078, T1528]
    vars:
      cred: { type: asset, asset_type: credential }
      actor: { type: identity }
    when:
      - relation: { type: grants, from: $cred, to: $actor }
    requires:
      - has_credential($cred)
    adds:
      - acts_as($actor)
    probability:
      base: { kind: beta, alpha: 9.0, beta: 1.0 }
      capability_scale: false

  - id: R8
    name: "도메인·그룹 장악 및 소속 호스트 제어"
    category: transition
    attack_techniques: [T1484, T1078]
    vars:
      mgr: { type: asset }
      grp: { type: group }
    when:
      - any:
          - relation: { type: manages, from: $mgr, to: $grp }
          - asset_role: { asset: $mgr, role: domain_controller, in_group: $grp, group_kind: directory_domain }
    requires:
      - foothold($mgr, admin)
    adds:
      - controls($grp)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  - id: R8-subgroup
    name: "장악한 그룹의 하위 그룹 장악"
    category: transition
    attack_techniques: [T1484]
    vars:
      parent: { type: group }
      child: { type: group }
    when:
      - group_parent: { child: $child, parent: $parent }
    requires:
      - controls($parent)
    adds:
      - controls($child)
    probability:
      base: { kind: beta, alpha: 9.9, beta: 0.1 }
      capability_scale: false

  - id: R8-members
    name: "장악한 그룹 소속 호스트 제어"
    category: transition
    attack_techniques: [T1484, T1072]
    vars:
      grp: { type: group }
      host: { type: asset, asset_type: host }
    when:
      - in_group: { asset: $host, group: $grp }
    requires:
      - controls($grp)
      - knows($host)
    adds:
      - foothold($host, admin)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false

  # ---- R9: 저장소 데이터 접근 (직접/호스팅, 비암호화/암호화 분해) ----
  - id: R9-direct
    name: "저장소 직접 관리자 데이터 접근"
    category: transition
    attack_techniques: [T1005, T1530, T1039]
    vars:
      store: { type: asset, asset_type: data_store }
      data: { type: asset, asset_type: data }
    when:
      - relation: { type: contains, from: $store, to: $data, encrypted: false }
    requires:
      - foothold($store, admin)
    adds:
      - data_access($data, read)
    probability:
      base: { kind: beta, alpha: 9.8, beta: 0.2 }
      capability_scale: false

  - id: R9-direct-encrypted
    name: "저장소 직접 관리자 암호화 데이터 복호화 접근"
    category: transition
    attack_techniques: [T1005, T1530]
    vars:
      store: { type: asset, asset_type: data_store }
      data: { type: asset, asset_type: data }
      key: { type: asset, asset_type: credential }
    when:
      - relation: { type: contains, from: $store, to: $data, encrypted: true, key_ref: $key }
    requires:
      - foothold($store, admin)
      - has_credential($key)
    adds:
      - data_access($data, read)
    probability:
      base: { kind: beta, alpha: 9.8, beta: 0.2 }
      capability_scale: false

  - id: R9-direct-write
    name: "저장소 직접 관리자 데이터 변조"
    category: transition
    attack_techniques: [T1565, T1485]
    vars:
      store: { type: asset, asset_type: data_store }
      data: { type: asset, asset_type: data }
    when:
      - relation: { type: contains, from: $store, to: $data }
    requires:
      - foothold($store, admin)
    adds:
      - data_access($data, write)
    probability:
      base: { kind: beta, alpha: 9.8, beta: 0.2 }
      capability_scale: false

  - id: R9-hosted-write
    name: "호스팅 서버 경유 저장소 데이터 변조"
    category: transition
    attack_techniques: [T1565, T1485]
    vars:
      holder: { type: asset, asset_type: host }
      store: { type: asset, asset_type: data_store }
      data: { type: asset, asset_type: data }
    when:
      - relation: { type: hosts, from: $holder, to: $store }
      - relation: { type: contains, from: $store, to: $data }
    requires:
      - foothold($holder, admin)
    adds:
      - data_access($data, write)
    probability:
      base: { kind: beta, alpha: 9.8, beta: 0.2 }
      capability_scale: false

  - id: R9-hosted
    name: "호스팅 서버 경유 저장소 데이터 접근"
    category: transition
    attack_techniques: [T1005, T1530, T1039]
    vars:
      holder: { type: asset, asset_type: host }
      store: { type: asset, asset_type: data_store }
      data: { type: asset, asset_type: data }
    when:
      - relation: { type: hosts, from: $holder, to: $store }
      - relation: { type: contains, from: $store, to: $data, encrypted: false }
    requires:
      - foothold($holder, admin)
    adds:
      - data_access($data, read)
    probability:
      base: { kind: beta, alpha: 9.8, beta: 0.2 }
      capability_scale: false

  - id: R9-hosted-encrypted
    name: "호스팅 서버 경유 암호화 저장소 복호화 접근"
    category: transition
    attack_techniques: [T1005, T1530]
    vars:
      holder: { type: asset, asset_type: host }
      store: { type: asset, asset_type: data_store }
      data: { type: asset, asset_type: data }
      key: { type: asset, asset_type: credential }
    when:
      - relation: { type: hosts, from: $holder, to: $store }
      - relation: { type: contains, from: $store, to: $data, encrypted: true, key_ref: $key }
    requires:
      - foothold($holder, admin)
      - has_credential($key)
    adds:
      - data_access($data, read)
    probability:
      base: { kind: beta, alpha: 9.8, beta: 0.2 }
      capability_scale: false

  - id: R10
    name: "노출 서비스 침해"
    category: transition
    attack_techniques: [T1190, T1210]
    vars:
      src: { type: asset }
      host: { type: asset, asset_type: host }
      svc: { type: asset, asset_type: service }
    when:
      - neq: [$src, $host]
      - reaches: { from: $src, to: $host, port: $svc.port, protocol: $svc.protocol }
      - relation: { type: runs, from: $host, to: $svc }
    requires:
      - foothold($src, none)
      - knows($host)
    adds:
      - foothold($host, user)
    probability:
      base: { kind: beta, alpha: 3.5, beta: 6.5 }
      capability_scale: true
      modifiers:
        - when: { config: [$svc, app.secure_development, true] }
          factor: 0.55
        - when: { config: [$svc, network.application_filtering, true] }
          factor: 0.70
        - when: { config: [$host, host.patch_currency, lagging] }
          factor: 1.80
        - when: { config: [$host, host.patch_currency, current] }
          factor: 0.75
        # 익명 접근이 아닌 인증 필수 서비스는 노출 침해가 훨씬 어렵다
        - when: { all: [ { config_set: [$svc, auth.methods] }, { not: { config: [$svc, access.anonymous, true] } } ] }
          factor: 0.40
        - when: { config: [$svc, auth.default_credentials, false] }
          factor: 0.75
        - when: { config: [$svc, auth.lockout, true] }
          factor: 0.80

  - id: R10-managed
    name: "관리형 서비스 직접 침해"
    category: transition
    attack_techniques: [T1190]
    vars:
      src: { type: asset }
      svc: { type: asset, asset_type: service }
    when:
      - neq: [$src, $svc]
      - asset_type: { asset: $svc, type: service }
      - not: { relation: { type: runs, to: $svc } }   # 호스트에서 실행되는 서비스는 R10이 다룬다
      - reaches: { from: $src, to: $svc, port: $svc.port, protocol: $svc.protocol }
    requires:
      - foothold($src, none)
      - knows($svc)
    adds:
      - foothold($svc, user)
    probability:
      base: { kind: beta, alpha: 3.0, beta: 7.0 }
      capability_scale: true
      modifiers:
        - when: { config: [$svc, app.secure_development, true] }
          factor: 0.55
        - when: { config: [$svc, network.application_filtering, true] }
          factor: 0.70
        - when: { all: [ { config_set: [$svc, auth.methods] }, { not: { config: [$svc, access.anonymous, true] } } ] }
          factor: 0.40
        - when: { config: [$svc, auth.default_credentials, false] }
          factor: 0.75
        - when: { config: [$svc, auth.lockout, true] }
          factor: 0.80

  - id: R10b
    name: "로컬 권한 상승"
    category: privilege_escalation
    attack_techniques: [T1068, T1543]
    vars:
      host: { type: asset, asset_type: host }
    when:
      - asset_type: { asset: $host, type: host }
    requires:
      - foothold($host, user)
    adds:
      - foothold($host, admin)
    probability:
      base: { kind: beta, alpha: 3.0, beta: 7.0 }
      capability_scale: true
      modifiers:
        - when: { config: [$host, host.patch_currency, lagging] }
          factor: 2.15
        - when: { config: [$host, host.patch_currency, current] }
          factor: 0.65
        - when: { config: [$host, host.os_hardening, strict] }
          factor: 0.60
        - when: { config: [$host, host.endpoint_protection, true] }
          factor: 0.75

  - id: R11
    name: "관리 주체 경유 제어"
    category: transition
    attack_techniques: [T1072, T1037, T1556]
    vars:
      mgr: { type: asset }
      target: { type: asset }
    when:
      - relation: { type: manages, from: $mgr, to: $target, expand_groups: false }   # 그룹 대상은 R8
    requires:
      - foothold($mgr, admin)
      - knows($target)
    adds:
      - foothold($target, admin)
    probability:
      base: { kind: beta, alpha: 9.5, beta: 0.5 }
      capability_scale: false
